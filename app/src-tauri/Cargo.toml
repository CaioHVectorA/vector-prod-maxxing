[package]
name = "vector-prod-maxxing"
version = "2.0.0"
description = "Vector Prod Maxxing v2 — Personal Study, Consistency & Robotics Cockpit (Linux + Antigravity)"
authors = ["CaioHVectorA"]
edition = "2021"

[lib]
name = "vector_prod_maxxing_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
notify = "6"
dirs = "5"
walkdir = "2"
